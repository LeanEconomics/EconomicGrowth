name = "UzawaModern"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["UzawaModern"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a â†¦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# Mathlib's header rule requires Apache text; this independent project uses Unlicense.
linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0-rc2"

[[lean_lib]]
name = "UzawaModern"
