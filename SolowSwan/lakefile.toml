name = "Solow1956"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Solow1956"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a â†¦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# Mathlib's header rule requires Apache text; this independent project uses Unlicense.
linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"

[[lean_lib]]
name = "Solow1956"
